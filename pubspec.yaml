import 'dart:io';
import 'package:flutter/material.dart';
import 'package:http/http.dart' as http;
import 'package:path_provider/path_provider.dart';
import 'package:pdfx/pdfx.dart';

void main() {
  runApp(const SideBooksApp());
}

class SideBooksApp extends StatelessWidget {
  const SideBooksApp({Key? key}) : super(key: key);

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'SideBooks Reader',
      debugShowCheckedModeBanner: false,
      theme: ThemeData.dark(),
      home: const NaturalCurlReaderScreen(),
    );
  }
}

class NaturalCurlReaderScreen extends StatefulWidget {
  const NaturalCurlReaderScreen({Key? key}) : super(key: key);

  @override
  State<NaturalCurlReaderScreen> createState() => _NaturalCurlReaderScreenState();
}

class _NaturalCurlReaderScreenState extends State<NaturalCurlReaderScreen>
    with SingleTickerProviderStateMixin {
  PdfDocument? _pdfDocument;
  List<PdfPageImage?> _pageImages = [];
  bool _isLoading = true;
  int _totalPages = 0;
  int _currentPage = 0;

  // アニメーション制御
  late AnimationController _animController;
  double _dragAmount = 0.0; // 0.0 (通常) ~ 1.0 (完全にめくられた)
  bool _isDragging = false;
  bool _isForward = true; // 次のページへ進むめくりか

  final String _samplePdfUrl =
      'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf';

  @override
  void initState() {
    super.initState();
    _animController = AnimationController(
      vsync: this,
      duration: const Duration(milliseconds: 300),
    )..addListener(() {
        setState(() {
          _dragAmount = _animController.value;
        });
      });

    _loadAndRenderPdf();
  }

  Future<void> _loadAndRenderPdf() async {
    try {
      final response = await http.get(Uri.parse(_samplePdfUrl));
      final dir = await getApplicationDocumentsDirectory();
      final file = File('${dir.path}/curl_sample_v2.pdf');
      await file.writeAsBytes(response.bodyBytes, flush: true);

      final doc = await PdfDocument.openFile(file.path);
      final count = doc.pagesCount;
      List<PdfPageImage?> images = [];

      for (int i = 1; i <= count; i++) {
        final page = await doc.getPage(i);
        final pageImage = await page.render(
          width: page.width * 2,
          height: page.height * 2,
          format: PdfPageImageFormat.jpeg,
        );
        await page.close();
        images.add(pageImage);
      }

      if (mounted) {
        setState(() {
          _pdfDocument = doc;
          _totalPages = count;
          _pageImages = images;
          _isLoading = false;
        });
      }
    } catch (e) {
      if (mounted) {
        setState(() {
          _isLoading = false;
        });
      }
    }
  }

  @override
  void dispose() {
    _animController.dispose();
    _pdfDocument?.close();
    super.dispose();
  }

  void _onHorizontalDragUpdate(DragUpdateDetails details, double screenWidth) {
    if (_animController.isAnimating) return;
    _isDragging = true;

    // 左スワイプ（←）で次のページ（右開き/マンガ仕様）
    final delta = -details.primaryDelta! / screenWidth;
    
    setState(() {
      if (delta > 0 && _currentPage < _totalPages - 1) {
        _isForward = true;
        _dragAmount = (_dragAmount + delta).clamp(0.0, 1.0);
      } else if (delta < 0 && _currentPage > 0) {
        _isForward = false;
        _dragAmount = (_dragAmount + delta).clamp(0.0, 1.0);
      }
    });
  }

  void _onHorizontalDragEnd(DragEndDetails details) {
    if (!_isDragging) return;
    _isDragging = false;

    if (_dragAmount > 0.35) {
      // ページめくり完了
      _animController.forward(from: _dragAmount).then((_) {
        setState(() {
          if (_isForward && _currentPage < _totalPages - 1) {
            _currentPage++;
          } else if (!_isForward && _currentPage > 0) {
            _currentPage--;
          }
          _dragAmount = 0.0;
          _animController.value = 0.0;
        });
      });
    } else {
      // 元に戻る
      _animController.reverse(from: _dragAmount).then((_) {
        setState(() {
          _dragAmount = 0.0;
        });
      });
    }
  }

  @override
  Widget build(BuildContext context) {
    final screenWidth = MediaQuery.of(context).size.width;

    return Scaffold(
      backgroundColor: const Color(0xFF1E1E1E),
      appBar: AppBar(
        backgroundColor: Colors.black.withOpacity(0.85),
        title: Text(
          _totalPages > 0 ? '${_currentPage + 1} / $_totalPages ページ' : '読み込み中...',
          style: const TextStyle(fontSize: 16),
        ),
        centerTitle: true,
      ),
      body: _isLoading
          ? const Center(
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  CircularProgressIndicator(color: Colors.white),
                  SizedBox(height: 16),
                  Text('PDFを読み込み中...'),
                ],
              ),
            )
          : GestureDetector(
              onHorizontalDragUpdate: (details) =>
                  _onHorizontalDragUpdate(details, screenWidth),
              onHorizontalDragEnd: _onHorizontalDragEnd,
              child: Stack(
                children: [
                  // 1. 下にあるページ（次のページ）
                  if (_currentPage < _totalPages - 1)
                    _buildPageWidget(_currentPage + 1),

                  // 2. めくられる上のページ（アニメーション付き）
                  ClipRect(
                    child: Align(
                      alignment: Alignment.centerLeft,
                      widthFactor: 1.0 - _dragAmount,
                      child: Container(
                        decoration: BoxDecoration(
                          boxShadow: [
                            if (_dragAmount > 0)
                              BoxShadow(
                                color: Colors.black.withOpacity(0.5 * (1 - _dragAmount)),
                                blurRadius: 15,
                                spreadRadius: 5,
                                offset: const Offset(8, 0),
                              ),
                          ],
                        ),
                        child: _buildPageWidget(_currentPage),
                      ),
                    ),
                  ),

                  // 3. めくられた紙のグラデーション影（カールの質感表現）
                  if (_dragAmount > 0)
                    Positioned(
                      left: screenWidth * (1.0 - _dragAmount) - 15,
                      top: 0,
                      bottom: 0,
                      width: 30,
                      child: Container(
                        decoration: BoxDecoration(
                          gradient: LinearGradient(
                            colors: [
                              Colors.black.withOpacity(0.0),
                              Colors.black.withOpacity(0.3),
                              Colors.black.withOpacity(0.0),
                            ],
                          ),
                        ),
                      ),
                    ),
                ],
              ),
            ),
    );
  }

  Widget _buildPageWidget(int index) {
    if (index < 0 || index >= _pageImages.length) {
      return const SizedBox.shrink();
    }
    final image = _pageImages[index];
    if (image == null) return const SizedBox.shrink();

    return Container(
      color: Colors.white,
      width: double.infinity,
      height: double.infinity,
      child: Image.memory(
        image.bytes,
        fit: BoxFit.contain,
      ),
    );
  }
}
